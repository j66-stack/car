[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-system"
version = "1.0.0"
description = "智能停车场车牌识别计费系统"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.8"
dependencies = [
    "pygame>=2.0.0",
    "opencv-python>=4.5.0",
    "numpy>=1.19.0",
    "pymysql>=1.0.0",
    "baidu-aip>=4.0.0",
    "matplotlib>=3.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0"
]

[project.scripts]
parking-system = "main:main"

[tool.setuptools]
packages = ["."]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]